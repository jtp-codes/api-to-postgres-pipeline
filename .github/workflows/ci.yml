name: Day 1 - PostgreSQL Ingestion CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify-pipeline:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: de_user
          POSTGRES_PASSWORD: de_password
          POSTGRES_DB: telemetry_dw
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U de_user -d telemetry_dw"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Pytest Proof Suite (Idempotency, Watermark & Pydantic Quarantine)
        env:
          DATABASE_URL: postgresql://de_user:de_password@localhost:5432/telemetry_dw
        run: python -m pytest -v

      - name: Execute Live Open-Meteo Ingestion (Pass 1)
        env:
          DATABASE_URL: postgresql://de_user:de_password@localhost:5432/telemetry_dw
        run: python -m src.pipeline

      - name: Execute Live Open-Meteo Ingestion (Pass 2 - Zero Duplicate Proof)
        env:
          DATABASE_URL: postgresql://de_user:de_password@localhost:5432/telemetry_dw
        run: python -m src.pipeline
